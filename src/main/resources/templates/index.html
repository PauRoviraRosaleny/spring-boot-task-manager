<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tasks Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex justify-content-between align-items-center p-3 mb-4 bg-light border-bottom">
            <div>
        <h4 class="mb-0">Task Manager</h4>
    </div>
        
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>
    <div class="container mt-5">
        <h1 class="text-center mb-4">My weekly tasks</h1>
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Add a new task</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/new}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" name="title" class="form-control" placeholder="Task title" required>
                    </div>
                    <div class="col-md-6">
                        <input type="text" name="description" class="form-control" placeholder="Short description">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="card shadow">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="task : ${tasks}">
                            <td>
                                <span th:text="${task.title}" th:class="${task.completed} ? 'text-decoration-line-through text-muted' : ''"></span>
                                <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-bs-toggle="modal" th:data-bs-target="'#modalEdit' + ${task.id}">
                                    <i class="bi bi-pencil-square text-primary"></i>
                                </button>
                            </td>
                            <td>
                                <span th:text="${task.description}"></span>
                                <button type="button" class="btn btn-link btn-sm p-0 ms-2" data-bs-toggle="modal" th:data-bs-target="'#modalEdit' + ${task.id}">
                                    <i class="bi bi-pencil-square text-primary"></i>
                                </button>
                            </td>
                            <td>
                                <span th:if="${task.completed}" class="badge bg-success">Completed</span>
                                <span th:unless="${task.completed}" class="badge bg-warning text-dark">Pending</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <form th:action="@{/complete/{id}(id=${task.id})}" method="post">
                                        <button type="submit" 
                                                th:class="${task.completed} ? 'btn btn-outline-secondary btn-sm' : 'btn btn-success btn-sm'"
                                                class="btn">
                                            <i th:class="${task.completed} ? 'bi bi-arrow-counterclockwise' : 'bi bi-check-lg'"></i>
                                            <span th:text="${task.completed} ? 'Pending' : 'Done'"></span>
                                        </button>
                                    </form>
                                
                                    <form th:action="@{/delete/{id}(id=${task.id})}" method="post" 
                                          onsubmit="return confirm('Are you sure you want to delete this task?')">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <div th:each="task : ${tasks}" class="modal fade" th:id="'modalEdit' + ${task.id}" tabindex="-1">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-header">Edit Task</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <form th:action="@{/edit/{id}(id=${task.id})}" method="post">
                                        <div class="modal-body">
                                            <div class="mb-3">
                                                <label class="form-label">Title</label>
                                                <input type="text" name="title" class="form-control" th:value="${task.title}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Description</label>
                                                <input type="text" name="description" class="form-control" th:value="${task.description}">
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <button type="submit" class="btn btn-primary">Save changes</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
